name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ── Desktop: Linux (.deb/.AppImage), macOS (.dmg), Windows (.msi) ──
  desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './client/src-tauri -> target'

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev

      - name: Install JS dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build desktop bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Larger heap so the Vite build (run via beforeBuildCommand) doesn't OOM.
          NODE_OPTIONS: '--max-old-space-size=4096'
        with:
          projectPath: client
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'Botion ${{ github.ref_name }}'
          releaseBody: |
            ## Downloads
            - **Linux**: `.deb`, `.AppImage`
            - **macOS**: `.dmg` (Apple Silicon + Intel)
            - **Windows**: `.msi`
            - **Android**: `.apk`, `.aab` (see the Android assets)
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # ── Android: .apk + .aab (separate flow; needs JDK + Android SDK/NDK) ──
  android:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;26.1.10909125" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Install Rust stable + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: 'aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android'

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './client/src-tauri -> target'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libsoup-3.0-dev

      - name: Install JS dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Tauri CLI
        run: pnpm --filter client add -D @tauri-apps/cli@^2

      - name: Prebuild frontend + icons
        working-directory: client
        run: pnpm tauri:prebuild
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Initialize Android project
        working-directory: client
        run: pnpm tauri android init --ci

      - name: Build Android APK + AAB
        working-directory: client
        run: pnpm tauri android build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: botion-android
          path: |
            client/src-tauri/gen/android/app/build/outputs/**/*.apk
            client/src-tauri/gen/android/app/build/outputs/**/*.aab
          if-no-files-found: warn
