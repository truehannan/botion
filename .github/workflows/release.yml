name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-native:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            targets: 'dmg,app'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            targets: 'dmg,app'
          - platform: 'ubuntu-22.04'
            args: ''
            targets: 'deb,appimage,apk,aab'
          - platform: 'windows-latest'
            args: ''
            targets: 'msi,exe'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-action@stable

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Android deps
        if: contains(matrix.targets, 'apk') || contains(matrix.targets, 'aab')
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build:client

      - name: Set Tauri bundle targets
        run: echo "TAURI_BUNDLE_TARGETS=${{ matrix.targets }}" >> $GITHUB_ENV

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: client
          tagName: botion-v__VERSION__
          releaseName: 'Botion v__VERSION__'
          releaseBody: |
            ## Downloads
            - **Windows**: `.exe` / `.msi`
            - **macOS**: `.dmg` / `.app` (Universal)
            - **Linux**: `.deb` / `.AppImage`
            - **Android**: `.apk` / `.aab`
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
