name = "botion-api"
main = "src/index.ts"
compatibility_date = "2024-06-20"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"

[[d1_databases]]
binding = "DB"
database_name = "botion-db"
# database_id is auto-resolved via name by pre-build script

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "botion-storage"

[[durable_objects.bindings]]
name = "BOTION_SYNC_ROOM"
class_name = "BotionSyncRoom"

[[migrations]]
tag = "v1"
new_classes = ["BotionSyncRoom"]

[[queues.producers]]
binding = "PAGE_SAVE_QUEUE"
queue = "page-save-queue"

[[queues.consumers]]
queue = "page-save-queue"
max_batch_size = 10
max_batch_timeout = 30

[[vectorize]]
binding = "VECTOR_INDEX"
index_name = "botion-vectors"

[ai]
binding = "AI"
