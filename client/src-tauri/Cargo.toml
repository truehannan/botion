[package]
name = "botion"
version = "0.1.0"
description = "Botion — edge-native collaborative workspace"
authors = ["Botion"]
edition = "2021"

# Library target consumed by both the desktop binary (main.rs) and the mobile
# (Android/iOS) build. Tauri's mobile tooling requires this [lib] target.
[lib]
name = "botion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Updater is desktop-only (no-op / unavailable on mobile).
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
