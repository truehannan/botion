# Botion — Cloudflare Worker (Hono)
# Run `wrangler dev` to start locally, `wrangler deploy` to publish.

name = "botion-api"
main = "src/index.ts"
compatibility_date = "2024-06-20"
workers_dev = true

[vars]
ENVIRONMENT = "development"

# ━━ Secrets (set via `wrangler secret put`) ━━━━━━━━━━━━━━━━━━━━━━
# JWT_SECRET   – HS256 key for auth tokens

# ━━ D1 (SQLite) ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Create:   wrangler d1 create botion-db
# Migrate:  wrangler d1 migrations apply botion-db
# database_id is intentionally EMPTY:
#   • Empty → wrangler >=4.45.0 AUTO-PROVISIONS botion-db on deploy and links it.
#   • `pnpm deploy:worker --d1 <id>` (or D1_DATABASE_ID=<id>) fills this in before
#     deploy, binding an existing DB. scripts/deploy.js does the substitution.
# Never hardcode a placeholder UUID — a stale id breaks deploy.
[[d1_databases]]
binding = "DB"
database_name = "botion-db"
database_id = ""

# ━━ R2 (Object Storage) ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Create: wrangler r2 bucket create botion-storage
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "botion-storage"

# ━━ Queues ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Create: wrangler queues create page-save-queue
[[queues.producers]]
binding = "PAGE_SAVE_QUEUE"
queue = "page-save-queue"

[[queues.consumers]]
queue = "page-save-queue"
max_batch_size = 10
max_batch_timeout = 30

# ━━ Workers AI ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
[ai]
binding = "AI"

# ━━ Vectorize (semantic search) — OPTIONAL ━━━━━━━━━━━━━━━━━━━
# Vectorize is NOT auto-provisioned. The app runs fine without it — search
# falls back to a D1 text search (server/utils/text-search.ts) and the code
# guards `env.VECTOR_INDEX` before use. To enable semantic search:
#   1. npx wrangler vectorize create botion-vectors --dimensions=768 --metric=cosine
#   2. Uncomment the binding below and redeploy.
# [[vectorize]]
# binding = "VECTOR_INDEX"
# index_name = "botion-vectors"
