## Botion API — Cloudflare Worker (Hono)
## Fill in IDs after creating resources with wrangler CLI.

name = "botion-api"
main = "src/index.ts"
compatibility_date = "2024-06-20"
workers_dev = true

[vars]
ENVIRONMENT = "development"

# ━━ D1 (SQLite) ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
[[d1_databases]]
binding = "DB"
database_name = "botion-db"
# database_id = "<fill after wrangler d1 create>"

# ━━ R2 (Object Storage) ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "botion-storage"

# ━━ Durable Objects (WebSocket Hibernation) ━━━━━━━━━━━━━━━━━━━━━
[[durable_objects.bindings]]
name = "BOTION_SYNC_ROOM"
class_name = "BotionSyncRoom"

[[migrations]]
tag = "v1"
new_classes = ["BotionSyncRoom"]

# ━━ Queues ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
[[queues.producers]]
binding = "PAGE_SAVE_QUEUE"
queue = "page-save-queue"

[[queues.consumers]]
queue = "page-save-queue"
max_batch_size = 10
max_batch_timeout = 30

# ━━ Vectorize (RAG) ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
[[vectorize]]
binding = "VECTOR_INDEX"
index_name = "botion-vectors"

# ━━ Workers AI ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
[ai]
binding = "AI"
